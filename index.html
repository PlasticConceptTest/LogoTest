<!DOCTYPE html>
<html lang="es">
<head>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;

    filterMinCF: 0.0001;
    filterBeta: 10;

    warmupTolerance: 10;
    missTolerance: 15;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"
>

  <!-- MODELO 3D -->

  <a-assets>

    <a-asset-item
      id="logo3d"
      src="./Logo Expotexitl 3D.glb">
    </a-asset-item>

  </a-assets>


  <!-- CÁMARA -->

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <!-- TARGET / MARCADOR -->

  <a-entity
    mindar-image-target="targetIndex: 0"
  >

    <!-- ILUMINACIÓN -->

    <a-light
      type="ambient"
      intensity="2.5">
    </a-light>

    <a-light
      type="directional"
      intensity="3"
      position="1 2 2">
    </a-light>

    <a-light
      type="directional"
      intensity="2"
      position="-2 1 1">
    </a-light>


    <!-- LOGO 3D FIJO -->

    <a-gltf-model
      src="#logo3d"

      position="0 0 0.1"

      rotation="0 0 0"

      scale="0.03 0.03 0.03"
    >
    </a-gltf-model>

  </a-entity>

</a-scene>

</body>
</html>
